version: 1

filters:
  include:
    - backend/**/*
  exclude:
    - backend/static/js/libs/**        # vendored libs
    - backend/static/images/**         # assets
    - backend/env/**                   # virtualenv
    - **/*.min.js

review:
  focus:
    - security
    - correctness
    - maintainability
    - performance
    - readability
  comment_mode: suggestions            # inline suggestions
  summarize: true                      # PR summary comment
  max_comments: 50
  severity_threshold: warning          # report warnings+ (tune if noisy)
  fail_on:                             # optional: block on these
    - security:high
    - bugs:high

prs:
  on: [opened, synchronize, reopened]
  drafts: false                        # skip drafts
  wip: false                           # skip WIP (if you use WIP prefixes)