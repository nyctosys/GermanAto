<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Management - GermanATO</title>
    <link rel="stylesheet" href="static/css/theme.css" />
    <link rel="stylesheet" href="static/css/search.css" />
    <link rel="stylesheet" href="../static/css/app-shell.css" />
    <script src="static/js/theme.js"></script>
  </head>
  <body>
    <!-- Top Navigation Header -->
    <header class="top-header">
      <div class="header-container">
        <div class="brand">
          <img
            src="static/images/logo-without-background.png"
            alt="GermanATO Logo"
            class="header-logo"
          />
          <div class="brand-text">
            <h1>Invoice Management</h1>
            <p>View and manage all invoices and their payment statuses</p>
          </div>
        </div>
        <div class="header-actions">
          <a href="#" id="back-btn" class="back-btn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M19 12H5M12 19l-7-7 7-7"></path>
            </svg>
            <span>Back</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Search Section -->
      <div class="search-section">
        <div class="search-container">
          <div class="search-field-group">
            <label for="keyword-search-input">Keyword Search</label>
            <input
              type="text"
              id="keyword-search-input"
              placeholder="Customer name, phone, reg number..."
              class="search-input"
            />
          </div>
          <div class="search-field-group">
            <label for="id-search-input">ID Search</label>
            <input
              type="number"
              id="id-search-input"
              placeholder="Invoice ID"
              class="search-input"
              min="1"
            />
          </div>
          <div class="search-buttons">
            <button id="search-btn" class="search-btn">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
            </button>
            <button
              id="clear-search-btn"
              class="clear-search-btn"
              style="display: none"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Date Filter Section -->
      <div class="date-filter-section">
        <div class="date-filter-label">Filter by Date:</div>
        <div class="date-filter-buttons">
          <button class="date-filter-btn" id="filter-today">Today</button>
          <button class="date-filter-btn" id="filter-this-week">This Week</button>
          <button class="date-filter-btn" id="filter-this-month">This Month</button>
          <button class="date-filter-btn" id="filter-this-year">This Year</button>
          <button class="date-filter-btn" id="filter-custom">Custom Range</button>
          <button class="date-filter-btn date-filter-clear" id="clear-date-filter" style="display: none;">Clear Date</button>
        </div>
        <div class="custom-range-container" id="custom-range-container" style="display: none;">
          <div class="custom-range-inputs">
            <div class="date-input-group">
              <label for="date-from">From Date</label>
              <input type="date" id="date-from" class="date-input" />
            </div>
            <div class="date-input-group">
              <label for="date-to">To Date</label>
              <input type="date" id="date-to" class="date-input" />
            </div>
            <div class="custom-range-actions">
              <button class="date-filter-btn apply-btn" id="apply-custom-range">Apply</button>
            </div>
          </div>
        </div>
      </div>

      <div class="invoice-status-toggle">
        <button class="invoice-status-btn active" id="show-all">All</button>
        <button class="invoice-status-btn" id="show-paid">Paid</button>
        <button class="invoice-status-btn" id="show-partial">
          Partially Paid
        </button>
        <button class="invoice-status-btn" id="show-unpaid">Unpaid</button>
      </div>
      <div id="invoice-management-results"></div>
    </main>

    <!-- Update Balance Modal -->
    <div id="update-balance-modal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); padding-top: 60px;">
      <div class="modal-content" style="background-color: #fefefe; margin: 5% auto; padding: 24px; border: 1px solid #888; width: 80%; max-width: 500px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 20px;">
          <h2 style="margin: 0; font-size: 1.5rem; color: #8b1538;">Update Payment Balance</h2>
          <span class="close-modal" id="close-balance-modal" style="color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer;">&times;</span>
        </div>
        <form id="balance-form">
          <input type="hidden" id="balance-invoice-id" />
          
          <div class="form-group" style="margin-bottom: 16px;">
            <label style="display: block; font-weight: 600; margin-bottom: 8px;">Invoice Details</label>
            <div style="background: #f7fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 0.9rem;">
              <div><strong>Invoice ID:</strong> <span id="balance-info-id">-</span></div>
              <div><strong>Total Due:</strong> <span id="balance-info-total">-</span></div>
              <div><strong>Amount Paid:</strong> <span id="balance-info-paid">-</span></div>
              <div><strong>Remaining Balance:</strong> <span id="balance-info-remaining" style="color: #8b1538; font-weight: bold;">-</span></div>
            </div>
          </div>
          
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="balance-paid-amount" style="display: block; font-weight: 600; margin-bottom: 8px;">Additional Paid Amount (PKR) *</label>
            <input type="number" id="balance-paid-amount" name="paid_amount" step="0.01" min="0" placeholder="0.00" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e0; box-sizing: border-box;" />
          </div>
          
          <div class="form-group" style="margin-bottom: 20px;">
            <label for="balance-proof-file" style="display: block; font-weight: 600; margin-bottom: 8px;">Payment Proof Attachment (Optional)</label>
            <input type="file" id="balance-proof-file" name="proof" accept="image/*,application/pdf" style="width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e0; background: #fff; box-sizing: border-box;" />
            <p style="font-size: 0.75rem; color: #a0aec0; margin: 4px 0 0 0;">Supported formats: Images or PDF</p>
          </div>
          
          <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #e2e8f0; padding-top: 16px;">
            <button type="button" class="btn btn-secondary" id="btn-cancel-balance" style="padding: 10px 16px; border-radius: 6px; border: 1px solid #cbd5e0; background: #fff; cursor: pointer;">Cancel</button>
            <button type="submit" class="btn btn-primary" style="padding: 10px 16px; border-radius: 6px; border: none; background: #8b1538; color: white; cursor: pointer; font-weight: 600;">Save Payment</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
      <p>&copy; 2025 GermanATO. All rights reserved.</p>
    </footer>
    <script src="static/js/auth_jwt.js"></script>
    <script src="../static/js/app-shell.js"></script>
    <script src="static/js/api-helper.js"></script>
    <script src="static/js/invoiceManagement.js"></script>
  </body>
</html>
