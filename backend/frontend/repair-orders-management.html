<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repair Orders Management - GermanATO</title>
    <link rel="stylesheet" href="static/css/theme.css" />
    <link rel="stylesheet" href="static/css/search.css" />
    <link rel="stylesheet" href="../static/css/app-shell.css" />
    <script src="static/js/theme.js"></script>
  </head>
  <body>
    <!-- Top Navigation Header -->
    <header class="top-header">
      <div class="header-container">
        <div class="brand">
          <img
            src="static/images/logo-without-background.png"
            alt="GermanATO Logo"
            class="header-logo"
          />
          <div class="brand-text">
            <h1>Repair Orders Management</h1>
            <p>View and manage all repair orders and their status</p>
          </div>
        </div>
        <div class="header-actions">
          <a href="#" id="back-btn" class="back-btn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M19 12H5M12 19l-7-7 7-7"></path>
            </svg>
            <span>Back</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Create Repair Order Button -->
      <div class="action-buttons">
        <button id="create-repair-order-btn" class="create-repair-order-btn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            ></path>
          </svg>
          <span>Create Repair Order</span>
        </button>
      </div>

      <!-- Search Section -->
      <div class="search-section">
        <div class="search-container">
          <div class="search-field-group">
            <label for="keyword-search">Keyword Search</label>
            <input
              type="text"
              id="keyword-search"
              placeholder="Customer name, phone, reg number..."
              class="search-input"
            />
          </div>
          <div class="search-field-group">
            <label for="id-search">ID Search</label>
            <input
              type="number"
              id="id-search"
              placeholder="Repair Order ID"
              class="search-input"
              min="1"
            />
          </div>
          <div class="search-buttons">
            <button id="search-btn" class="search-btn">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
            </button>
            <button
              id="clear-search-btn"
              class="clear-search-btn"
              style="display: none"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="repair-order-status-toggle">
        <button class="repair-order-status-btn active" id="show-all">
          All Orders
        </button>
        <button class="repair-order-status-btn" id="show-received">
          Received
        </button>
        <button class="repair-order-status-btn" id="show-diagnosis">
          Diagnosis
        </button>
        <button class="repair-order-status-btn" id="show-repair">Repair</button>
        <button class="repair-order-status-btn" id="show-testing">
          Testing
        </button>
        <button class="repair-order-status-btn" id="show-complete">
          Complete
        </button>
      </div>

      <div id="repair-orders-management-results"></div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <p>&copy; 2025 GermanATO. All rights reserved.</p>
    </footer>
    <script src="static/js/notification-utils.js"></script>
    <script src="static/js/auth_jwt.js"></script>
    <script src="../static/js/app-shell.js"></script>
    <script src="static/js/api-helper.js"></script>
    <script src="static/js/repairOrdersManagement.js"></script>
  </body>
</html>
