<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parts Expenses - GermanATO</title>
    <link rel="stylesheet" href="../static/css/theme.css" />
    <link rel="stylesheet" href="../static/css/dailyExpenses.css" />
    <script src="../static/js/theme.js"></script>
  </head>
  <body>
    <!-- Top Navigation Header -->
    <header class="top-header">
      <div class="header-container">
        <div class="brand">
          <img
            src="../static/images/logo-without-background.png"
            alt="GermanATO Logo"
            class="header-logo"
          />
          <div class="brand-text">
            <h1>Parts Expenses</h1>
            <p>Track expenses related to parts and inventory</p>
          </div>
        </div>
        <div class="header-actions">
          <a href="finance-management.html" class="back-btn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M19 12H5M12 19l-7-7 7-7"></path>
            </svg>
            <span>Back</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Add Expense Form -->
      <div class="section-card">
        <div class="section-header">
          <div class="icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path
                d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
              ></path>
            </svg>
          </div>
          <h2>Add New Parts Expense</h2>
        </div>
        <form id="expense-form" class="expense-form">
          <div class="form-row">
            <div class="form-group">
              <label for="expense-date">Date</label>
              <input type="date" id="expense-date" name="date" required />
            </div>
            <div class="form-group">
              <label for="expense-amount">Amount (PKR)</label>
              <input
                type="number"
                id="expense-amount"
                name="amount"
                step="0.01"
                min="0"
                placeholder="0.00"
                required
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="expense-description">Description</label>
              <input
                type="text"
                id="expense-description"
                name="description"
                placeholder="Enter expense description"
                required
              />
            </div>
            <div class="form-group">
              <label for="expense-category">Category</label>
              <select id="expense-category" name="category" required>
                <option value="Parts Expenses" selected>Parts Expenses</option>
                <option value="Auto Parts">Auto Parts</option>
                <option value="Inventory Purchase">Inventory Purchase</option>
                <option value="Component Purchase">Component Purchase</option>
                <option value="Spare Parts">Spare Parts</option>
                <option value="Other Parts">Other Parts</option>
              </select>
            </div>
          </div>
          <div class="form-group full-width">
            <label for="expense-notes">Notes (Optional)</label>
            <textarea
              id="expense-notes"
              name="notes"
              placeholder="Additional notes about the expense"
            ></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Add Expense
            </button>
            <button type="button" id="clear-form" class="btn btn-secondary">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                ></path>
              </svg>
              Clear Form
            </button>
          </div>
        </form>
      </div>

      <!-- Search and Filter Section -->
      <div class="search-section">
        <div class="search-row">
          <div class="search-group">
            <label for="search-keyword">Search by Description</label>
            <input
              type="text"
              id="search-keyword"
              placeholder="Search expenses..."
            />
          </div>
          <div class="search-group">
            <label for="search-from-date">From Date</label>
            <input type="date" id="search-from-date" />
          </div>
          <div class="search-group">
            <label for="search-to-date">To Date</label>
            <input type="date" id="search-to-date" />
          </div>
          <div class="search-group">
            <button id="clear-search" class="btn btn-secondary">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              Clear
            </button>
          </div>
        </div>
      </div>

      <!-- Summary Section -->
      <div class="summary-section">
        <div class="summary-card expense-card">
          <div class="card-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
              <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
          </div>
          <h3>Total Parts Expenses</h3>
          <p id="total-amount">PKR 0.00</p>
        </div>
      </div>

      <!-- Expenses Table -->
      <div class="table-section">
        <div class="section-header">
          <div class="icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <h2>Parts Expenses List</h2>
        </div>
        <div class="table-container">
          <table id="expenses-table" class="expenses-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Notes</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="expenses-tbody">
              <!-- Expenses will be loaded here -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <p>&copy; 2025 GermanATO. All rights reserved.</p>
    </footer>

    <!-- Edit Expense Modal -->
    <div id="edit-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Edit Parts Expense</h3>
          <span class="close">&times;</span>
        </div>
        <form id="edit-expense-form" class="expense-form">
          <input type="hidden" id="edit-expense-id" name="id" />
          <div class="form-row">
            <div class="form-group">
              <label for="edit-expense-date">Date</label>
              <input type="date" id="edit-expense-date" name="date" required />
            </div>
            <div class="form-group">
              <label for="edit-expense-amount">Amount (PKR)</label>
              <input
                type="number"
                id="edit-expense-amount"
                name="amount"
                step="0.01"
                min="0"
                required
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="edit-expense-description">Description</label>
              <input
                type="text"
                id="edit-expense-description"
                name="description"
                required
              />
            </div>
            <div class="form-group">
              <label for="edit-expense-category">Category</label>
              <select id="edit-expense-category" name="category" required>
                <option value="Parts Expenses">Parts Expenses</option>
                <option value="Auto Parts">Auto Parts</option>
                <option value="Inventory Purchase">Inventory Purchase</option>
                <option value="Component Purchase">Component Purchase</option>
                <option value="Spare Parts">Spare Parts</option>
                <option value="Other Parts">Other Parts</option>
              </select>
            </div>
          </div>
          <div class="form-group full-width">
            <label for="edit-expense-notes">Notes (Optional)</label>
            <textarea id="edit-expense-notes" name="notes"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
                ></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              Update Expense
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeEditModal()"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="../static/js/auth_jwt.js"></script>
    <script src="../static/js/api-helper.js"></script>
    <script src="../static/js/partsExpenses.js"></script>
  </body>
</html>
