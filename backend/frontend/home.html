<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GermanATO - Dashboard</title>
    <link rel="stylesheet" href="../static/css/theme.css" />
    <link rel="stylesheet" href="../static/css/home.css" />
    <link rel="stylesheet" href="../static/css/app-shell.css" />
    <link rel="stylesheet" href="../static/css/dashboard.css" />
    <script src="../static/js/theme.js"></script>
    <script src="../static/js/notification-utils.js"></script>
  </head>
  <body>
    <!-- Top Navigation Header -->
    <header class="top-header">
      <div class="header-container">
        <div class="brand">
          <img
            src="../static/images/logo-without-background.png"
            alt="GermanATO Logo"
            class="header-logo"
          />
          <div class="brand-text">
            <h1>GermanATO</h1>
            <p>Business Management System</p>
          </div>
        </div>
        <div class="header-actions">
          <a href="settings.html" class="settings-btn" title="Settings">
            <svg
              class="settings-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </a>
          <button class="logout-btn" onclick="handleLogout()">
            <svg
              class="logout-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <!-- Main Content -->
    <main class="main-content">
      <div class="dash">
        <header class="dash__head">
          <div>
            <h2 class="dash__title" id="dashGreeting">Today</h2>
            <p class="dash__sub" id="dashSubtitle">Your pending work</p>
          </div>
          <button type="button" class="dash__refresh" id="dashRefresh">Refresh</button>
        </header>

        <div id="dashContent" class="dash__content"></div>
      </div>
    </main>

    <!-- Coming Soon Modal -->
    <div id="coming-soon-modal" class="coming-soon-modal">
      <div class="coming-soon-modal-content">
        <div class="coming-soon-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
            ></path>
          </svg>
        </div>
        <h2>Coming Soon</h2>
        <p>WhatsApp Notifications feature is under development and will be available soon.</p>
        <button class="coming-soon-close-btn" onclick="closeComingSoonPopup()">
          Got it
        </button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="main-footer">
      <p>&copy; 2025 GermanATO. All rights reserved.</p>
    </footer>

    <script src="../static/js/auth_jwt.js"></script>
    <script src="../static/js/app-shell.js"></script>
    <script src="../static/js/api-helper.js"></script>
    <script src="../static/js/dashboard.js"></script>
    <script>
      // Handle logout function
      function handleLogout() {
        if (typeof auth !== "undefined" && auth.logout) {
          auth.logout();
          // Immediately redirect to login page after logout
          window.location.href = "login.html";
        } else {
          console.error("Auth not available");
          // Fallback: clear tokens and redirect to login page
          localStorage.removeItem("accessToken");
          localStorage.removeItem("refreshToken");
          localStorage.removeItem("user");
          window.location.href = "login.html";
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        if (!auth.requirePageAccess("home")) {
          return;
        }
        loadDashboard();
        document.getElementById("dashRefresh").addEventListener("click", loadDashboard);
      });

      // Coming Soon Popup Functions
      function showComingSoonPopup() {
        const modal = document.getElementById("coming-soon-modal");
        if (modal) {
          modal.style.display = "flex";
        }
      }

      function closeComingSoonPopup() {
        const modal = document.getElementById("coming-soon-modal");
        if (modal) {
          modal.style.display = "none";
        }
      }

      // Close modal when clicking outside
      document.addEventListener("click", function (event) {
        const modal = document.getElementById("coming-soon-modal");
        if (event.target === modal) {
          closeComingSoonPopup();
        }
      });

      // Close modal with Escape key
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeComingSoonPopup();
        }
      });
    </script>
  </body>
</html>
