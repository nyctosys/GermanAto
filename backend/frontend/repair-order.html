<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Repair Order - GermanATO</title>
    <link rel="stylesheet" href="static/css/repair-order.css" />
  </head>
  <body>
    <!-- Top Navigation Header -->
    <header class="top-header">
      <div class="header-container">
        <div class="brand">
          <img
            src="static/images/logo-without-background.png"
            alt="GermanATO Logo"
            class="header-logo"
          />
          <div class="brand-text">
            <h1 id="page-title">Create Repair Order</h1>
            <p id="page-description">
              Generate repair order from approved quote
            </p>
          </div>
        </div>
        <div class="header-actions">
          <a href="#" id="back-btn" class="back-btn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M19 12H5M12 19l-7-7 7-7"></path>
            </svg>
            <span>Back</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <form id="repair-order-form" class="repair-order-form">
        <!-- Customer Information -->
        <div class="section-card">
          <div class="section-header">
            <div class="icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <h2>Customer Information</h2>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label for="customer-select">Select Customer</label>
              <div class="select-with-button">
                <div class="searchable-dropdown">
                  <input
                    type="text"
                    id="customer-select"
                    class="input-fields"
                    placeholder="Search customers..."
                    autocomplete="off"
                    inputmode="text"
                  />
                  <div
                    class="dropdown-options"
                    id="customer-dropdown-options"
                    style="display: none"
                  >
                    <!-- Customer options will be populated here -->
                  </div>
                </div>
                <button
                  type="button"
                  class="add-btn"
                  onclick="openCustomerModal()"
                  title="Add New Customer"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label for="customer-name">Customer Name *</label>
              <input
                type="text"
                id="customer-name"
                name="customer_name"
                required
              />
            </div>
            <div class="form-group">
              <label for="customer-phone">Phone Number *</label>
              <input
                type="tel"
                id="customer-phone"
                name="customer_phone"
                required
              />
            </div>
            <div class="form-group">
              <label for="customer-address">Address *</label>
              <input
                type="text"
                id="customer-address"
                name="customer_address"
                required
              />
            </div>
          </div>
        </div>

        <!-- Vehicle Information -->
        <div class="section-card">
          <div class="section-header">
            <div class="icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"
                ></path>
                <polygon points="12 15 17 21 7 21 12 15"></polygon>
              </svg>
            </div>
            <h2>Vehicle Information</h2>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label for="car-select">Select Vehicle</label>
              <div class="select-with-button">
                <div class="searchable-dropdown">
                  <input
                    type="text"
                    id="car-select"
                    class="input-fields"
                    placeholder="Search vehicles..."
                    autocomplete="off"
                    inputmode="text"
                  />
                  <div
                    class="dropdown-options"
                    id="car-dropdown-options"
                    style="display: none"
                  >
                    <!-- Vehicle options will be populated here -->
                  </div>
                </div>
                <button
                  type="button"
                  class="add-btn"
                  onclick="openCarModal()"
                  title="Add New Vehicle"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label for="reg-number">Registration Number *</label>
              <input
                type="text"
                id="reg-number"
                name="customer_reg_no"
                required
              />
            </div>
            <div class="form-group">
              <label for="made">Make/Model *</label>
              <input type="text" id="made" name="customer_made" required />
            </div>
            <div class="form-group">
              <label for="mileage">Mileage</label>
              <input type="text" id="mileage" name="customer_mileage" />
            </div>
            <div class="form-group">
              <label for="vin">VIN</label>
              <input type="text" id="vin" name="customer_vin" />
            </div>
            <div class="form-group">
              <label for="color">Color</label>
              <input type="text" id="color" name="customer_color" />
            </div>
            <div class="form-group">
              <label for="chasis">Chassis</label>
              <input type="text" id="chasis" name="customer_chasis" />
            </div>
          </div>
        </div>

        <!-- Problem Description -->
        <div class="section-card">
          <div class="section-header">
            <div class="icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"
                ></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </div>
            <h2>Problem Description</h2>
          </div>
          <div class="form-group">
            <label for="problem-description">Describe the problem *</label>
            <textarea
              id="problem-description"
              name="problem_description"
              rows="4"
              required
            ></textarea>
          </div>
        </div>

        <!-- Assigned Worker -->
        <div class="section-card">
          <div class="section-header">
            <div class="icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </div>
            <h2>Assigned Worker</h2>
          </div>
          <div class="form-group">
            <label for="worker-select">Select Worker</label>
            <div class="searchable-dropdown">
              <input
                type="text"
                id="worker-select"
                class="input-fields"
                placeholder="Search workers..."
                autocomplete="off"
                inputmode="text"
              />
              <div
                class="dropdown-options"
                id="worker-dropdown-options"
                style="display: none"
              >
                <!-- Worker options will be populated here -->
              </div>
            </div>
            <input type="hidden" id="worker-id" name="worker_id" />
            <input type="hidden" id="worker-name" name="worker_name" />
          </div>
        </div>

        <!-- Parts Section -->
        <div class="section-card">
          <div class="section-header">
            <div class="icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="9" x2="15" y2="15"></line>
                <line x1="15" y1="9" x2="9" y2="15"></line>
              </svg>
            </div>
            <h2>Parts Required</h2>
          </div>
          <div id="parts-container">
            <!-- Parts will be added here dynamically -->
          </div>
          <button type="button" id="add-part-btn" class="add-btn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add Part</span>
          </button>
        </div>

        <!-- Labour Section -->
        <div class="section-card">
          <div class="section-header">
            <div class="icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
            </div>
            <h2>Labour Tasks</h2>
          </div>
          <div id="labour-container">
            <!-- Labour tasks will be added here dynamically -->
          </div>
          <button type="button" id="add-labour-btn" class="add-btn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add Labour Task</span>
          </button>
        </div>

        <!-- Submit Button -->
        <div class="form-actions">
          <button type="submit" class="submit-btn" id="submit-btn">
            Create Repair Order
          </button>
        </div>
      </form>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <p>&copy; 2025 GermanATO. All rights reserved.</p>
    </footer>

    <!-- Customer Modal -->
    <div id="customer-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="customer-modal-title">Add Customer</h2>
          <button class="close-btn" id="close-customer-modal">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M18 6L6 18M6 6L18 18"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <form id="customer-form">
          <div class="form-group">
            <label for="modal-customer-name">Name</label>
            <input
              type="text"
              id="modal-customer-name"
              name="modal-customer-name"
            />
          </div>
          <div class="form-group">
            <label for="modal-customer-phone">Phone</label>
            <input
              type="tel"
              id="modal-customer-phone"
              name="modal-customer-phone"
            />
          </div>
          <div class="form-group">
            <label for="modal-customer-address">Address</label>
            <textarea
              id="modal-customer-address"
              name="modal-customer-address"
            ></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="cancel-btn" id="cancel-customer">
              Cancel
            </button>
            <button type="submit" class="save-btn">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Car Modal -->
    <div id="car-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="car-modal-title">Add Vehicle</h2>
          <button class="close-btn" id="close-car-modal">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M18 6L6 18M6 6L18 18"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <form id="car-form">
          <div class="form-group">
            <label for="modal-car-customer">Customer</label>
            <select id="modal-car-customer" name="modal-car-customer">
              <option value="">Select Customer</option>
            </select>
          </div>
          <div class="form-group">
            <label for="modal-car-plate">Registration Number *</label>
            <input
              type="text"
              id="modal-car-plate"
              name="modal-car-plate"
              required
            />
          </div>
          <div class="form-group">
            <label for="modal-car-make">Make/Model *</label>
            <input
              type="text"
              id="modal-car-make"
              name="modal-car-make"
              placeholder="e.g., Toyota Corolla"
              required
            />
          </div>
          <div class="form-group">
            <label for="modal-car-mileage">Mileage</label>
            <input
              type="text"
              id="modal-car-mileage"
              name="modal-car-mileage"
            />
          </div>
          <div class="form-group">
            <label for="modal-car-vin">VIN</label>
            <input type="text" id="modal-car-vin" name="modal-car-vin" />
          </div>
          <div class="form-group">
            <label for="modal-car-color">Color</label>
            <input type="text" id="modal-car-color" name="modal-car-color" />
          </div>
          <div class="form-group">
            <label for="modal-car-chassis">Chassis</label>
            <input
              type="text"
              id="modal-car-chassis"
              name="modal-car-chassis"
            />
          </div>
          <div class="form-actions">
            <button type="button" class="cancel-btn" id="cancel-car">
              Cancel
            </button>
            <button type="submit" class="save-btn">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script src="static/js/notification-utils.js"></script>
    <script src="static/js/auth_jwt.js"></script>
    <script src="static/js/api-helper.js"></script>
    <script src="static/js/repairOrder.js"></script>
  </body>
</html>
