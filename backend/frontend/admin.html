<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GermanATO - Users Management</title>
    <link rel="stylesheet" href="../static/css/admin.css" />
  </head>
  <body>
    <a href="#" id="back-btn" class="back-btn">
      <span>Back</span>
    </a>

    <div class="container">
      <div class="header">
        <h1>Users Management</h1>
        <p>Manage users and system settings</p>
      </div>

      <div class="main-content" id="user-management-section">
        <div class="controls-section">
          <button class="add-btn" onclick="openAddUserModal()">
            <span>+</span>
            Add New User
          </button>
        </div>

        <div class="users-table" id="users-table">
          <!-- Users will be loaded here -->
        </div>
      </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="user-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Add New User</h2>
          <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <form id="user-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" required>
              <option value="">Select Role</option>
              <option value="admin">Admin</option>
              <option value="accountant">Accountant</option>
              <option value="inventory_manager">Inventory Manager</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" class="cancel-btn" onclick="closeModal()">
              Cancel
            </button>
            <button type="submit" class="save-btn">Save User</button>
          </div>
        </form>
      </div>
    </div>

    <footer>
      <p>&copy; 2025 GermanATO. All rights reserved.</p>
    </footer>

    <script src="../static/js/notification-utils.js"></script>
    <script src="../static/js/auth_jwt.js"></script>
    <script src="../static/js/api-helper.js"></script>
    <script src="../static/js/admin.js"></script>
  </body>
</html>
