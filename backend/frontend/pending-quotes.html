<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pending Quotes - GermanATO</title>
    <link rel="stylesheet" href="static/css/search.css" />
    <style>
      .quote-status-toggle {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        justify-content: center;
      }
      .quote-status-btn {
        background: #f8f9fa;
        color: #0f0f0f;
        border: none;
        border-radius: 8px;
        padding: 0.75rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }
      .quote-status-btn.active#show-pending,
      .quote-status-btn#show-pending:focus,
      .quote-status-btn#show-pending:hover {
        background: #dc3545;
        color: #fff;
        border: none;
      }
      .quote-status-btn.active#show-approved,
      .quote-status-btn#show-approved:focus,
      .quote-status-btn#show-approved:hover {
        background: #28a745;
        color: #fff;
        border: none;
      }

      .quote-status-btn.active#show-all,
      .quote-status-btn#show-all:focus,
      .quote-status-btn#show-all:hover {
        background: #6c757d;
        color: #fff;
        border: none;
      }

      /* Search Section Styles */
      .search-section {
        margin-bottom: 2rem;
      }

      .search-container {
        display: flex;
        max-width: 800px;
        margin: 0 auto;
        gap: 15px;
        align-items: flex-end;
        flex-wrap: wrap;
      }

      .search-field-group {
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .search-field-group label {
        font-size: 0.875rem;
        font-weight: 600;
        color: #374151;
        text-align: left;
      }

      .search-input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .search-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .search-buttons {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }

      .search-btn {
        padding: 12px 16px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.2s;
      }

      .search-btn:hover {
        background: #2563eb;
      }

      .clear-search-btn {
        padding: 12px 16px;
        background: #6b7280;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.2s;
      }

      .clear-search-btn:hover {
        background: #4b5563;
      }

      @media (max-width: 768px) {
        .search-container {
          flex-direction: column;
          gap: 12px;
        }

        .search-field-group {
          min-width: unset;
          width: 100%;
        }

        .search-buttons {
          width: 100%;
          justify-content: center;
        }

        .search-btn,
        .clear-search-btn {
          flex: 1;
          max-width: 120px;
        }
      }
    </style>
  </head>
  <body>
    <a href="#" id="back-btn" class="back-btn"><span>Back</span></a>
    <div class="container">
      <div class="header">
        <h1>Quotes Management</h1>
        <p>View and manage quotes by status</p>
      </div>
      <br />

      <!-- Search Section -->
      <div class="search-section">
        <div class="search-container">
          <div class="search-field-group">
            <label for="keyword-search-input">Keyword Search</label>
            <input
              type="text"
              id="keyword-search-input"
              placeholder="Customer name, phone, reg number..."
              class="search-input"
            />
          </div>
          <div class="search-field-group">
            <label for="id-search-input">ID Search</label>
            <input
              type="number"
              id="id-search-input"
              placeholder="Quote ID"
              class="search-input"
              min="1"
            />
          </div>
          <div class="search-buttons">
            <button id="search-btn" class="search-btn">
              <span>🔍</span>
            </button>
            <button
              id="clear-search-btn"
              class="clear-search-btn"
              style="display: none"
            >
              <span>✕</span>
            </button>
          </div>
        </div>
      </div>

      <div class="quote-status-toggle">
        <button class="quote-status-btn active" id="show-all">
          All Quotes
        </button>
        <button class="quote-status-btn" id="show-pending">
          Pending Quotes
        </button>
        <button class="quote-status-btn" id="show-approved">
          Approved Quotes
        </button>
      </div>
      <div id="pending-quotes-results"></div>
    </div>
    <script src="../static/js/auth_jwt.js"></script>
    <script src="../static/js/api-helper.js"></script>
    <script src="static/js/pendingQuotes.js"></script>
  </body>
</html>
